# mise — global dev tool configuration
# Symlinked from ~/.config/mise/config.toml so this file is the source of truth.
# Cross-platform (macOS + Linux). macOS-only tools live in macos/Brewfile.
#
# Backend preference: aqua (prebuilt binary) > github (binary release) > npm/pipx (when no binary)
# Avoid go:/cargo: backends — they compile from source.
# Note: ubi: is deprecated as of mise 2026.4.x; use github: instead.
#
# Install everything:  mise install
# Inventory:           mise ls --installed
# Refresh latest:      mise upgrade

[settings]
# Security buffer: ignore versions published <3 days ago (skip fast on supply-chain compromises)
minimum_release_age = "3d"
# Trust this config for auto-install when entering directories
idiomatic_version_file_enable_tools = ["node", "python", "go", "ruby"]

[tools]
# === Languages & runtimes ===
node    = "22"
python  = "3.12"
go      = "1.26"
pnpm    = "latest"
uv      = "latest"

# === Cloud / Kubernetes ===
terraform        = "1.14"
kubectl          = "1.36"
helm             = "latest"
kind             = "latest"
kubectx          = "latest"   # also installs kubens
stern            = "latest"
krew             = "latest"
cloud-sql-proxy  = "latest"
cloudflared      = "latest"
awscli           = "latest"

# === Infra / security scanning ===
# trivy + osv-scanner moved to per-project ~/src/iden2/infra-tf/.mise.toml
tflint      = "latest"
tfsec       = "latest"
checkov     = "latest"

# === Data / shell ===
jq = "latest"
yq = "latest"

# === File search / nav ===
fd       = "latest"
bat      = "latest"
ripgrep  = "latest"
fzf      = "latest"
gh       = "latest"
ast-grep = "latest"
# ncdu / btop have no macOS binaries via aqua — kept in brew on Mac, install via mise on Linux

# === Containers ===
ctop = "latest"
dive = "latest"

# === Linting / quality ===
hadolint      = "latest"
actionlint    = "latest"
shellcheck    = "latest"
yamllint      = "latest"           # pipx (no binary)
golangci-lint = "latest"
"aqua:securego/gosec" = "latest"
gotestsum     = "latest"
prettier      = "latest"           # npm (no binary)
swag          = "latest"

# Go x/tools — no prebuilt binary upstream, must build from source
"go:golang.org/x/tools/cmd/goimports"  = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

# === Build / task / hooks ===
task       = "latest"
lefthook   = "latest"
air        = "latest"
pre-commit = "latest"

# === API / docs ===
"npm:@redocly/cli"                        = "latest"
# spectral pulls rollup 2.x transitively, and mise's no-downgrade trust policy
# blocks it: rollup@2.80.0 was published 2026-02-22, AFTER 4.52.4 (2025-10-03)
# which carries provenance, yet has no attestation of its own. That ordering is
# what trips the check, and the shape is worth taking seriously — a fresh release
# on an EOL major line with no provenance is also what a targeted attack looks
# like, since stale lockfiles resolve there.
#
# Checked the registry before excluding rather than after. It is tagged
# `backports-2`, rollup's official 2.x backport channel (alongside `backports-3`),
# published by lukastaegert — the project lead — and carries an npm signature.
# Current rollup ships from CI via a trusted publisher, which is why 4.x has
# attestations; the backport lines are cut by hand and do not. Benign.
#
# Pinned to the exact version on purpose. A bare "rollup" would exempt every
# version forever, including a genuinely tampered future one, and this exclusion
# should expire naturally the moment the resolved version moves.
"npm:@stoplight/spectral-cli" = { version = "latest", trust_policy_excludes = ["rollup@2.80.0"] }
"npm:@openapitools/openapi-generator-cli" = "latest"

# === Editors / TUI ===
# neovim moved to macos/Brewfile on 2026-08-05. It belongs there because it is
# wanted on ONE machine: this file is installed verbatim on the devbox too, and
# `mise install` has no per-platform conditional, so listing it here was the only
# thing putting a 40 MB editor on a headless box. The devbox uses apt's vim.

# === Dev tooling ===
mkcert   = "latest"
jwt      = "latest"   # jwt-cli (registry name is "jwt")
"npm:esbuild" = "latest"
temporal = "latest"
packer   = "latest"   # was in ~/go/bin; aqua: hashicorp/packer
glow     = "latest"   # markdown viewer; was in ~/go/bin; aqua: charmbracelet/glow
"github:go-acme/lego" = "latest"   # ACME/Let's Encrypt client; was in ~/go/bin

# === AI / cloud SDKs ===
# Upgrade with `mise up codex`, NEVER with `codex update`. That self-updater writes
# an npm global into the NODE prefix, and installs/node/22/bin sits at PATH position
# 2 while installs/codex/*/bin sits at 55 -- so it silently shadows this entry. It
# put 0.147.0 in front of the pinned 0.144.1 on the Mac. `latest` plus `mise up`
# gives the same freshness with one owner, and minimum_release_age above is the
# floor that replaces the old 0.144+ pin.
codex    = "latest"   # @openai/codex (npm backend — mise registry switched from aqua, which lacked codex-code-mode-host)
firebase = "latest"   # firebase-tools (aqua binary)
wrangler = "latest"   # cloudflare wrangler (npm only)

# === Migrations ===
"github:golang-migrate/migrate" = "latest"
