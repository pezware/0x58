# Codex CLI -- an optional agent. mise reads this file only when it is linked
# into the global conf.d, and bashrc defines the codex() wrapper on the same
# condition:
#
#   mkdir -p ~/.config/mise/conf.d
#   ln -sfn ~/src/public/0x58/dotfiles/mise/conf.d/codex.toml ~/.config/mise/conf.d/codex.toml
#   mise install codex
#
# Opt out: remove the link, then `mise uninstall codex --all`. The devbox opts in
# from dev/nodes/roles/devbox/bootstrap.sh. The Mac dropped Codex on 2026-11-08.
#
# Upgrade with `mise up codex`, NEVER with `codex update`. That self-updater writes
# an npm global into the NODE prefix, and installs/node/22/bin sits at PATH position
# 2 while installs/codex/*/bin sits at 55 -- so it silently shadows this entry. It
# put 0.147.0 in front of the pinned 0.144.1 on the Mac. `latest` plus `mise up`
# gives the same freshness with one owner, and minimum_release_age in config.toml
# is the floor that replaces the old 0.144+ pin.
[tools]
codex = "latest"   # @openai/codex (npm backend — mise registry switched from aqua, which lacked codex-code-mode-host)
