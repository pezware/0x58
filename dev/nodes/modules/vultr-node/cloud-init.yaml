#cloud-config
# Templated by terraform's templatefile(). Dollar-brace expressions below are HCL
# refs, resolved before the guest ever sees this file — note that YAML comments
# are NOT exempt, the whole file is parsed as a template first. The two shell
# scripts are embedded raw via file() so their shell vars survive untouched.
hostname: ${hostname}
preserve_hostname: false

write_files:
  # tmpfs — gone on reboot. The auth key is only needed for the first
  # `tailscale up`; afterwards /var/lib/tailscale state carries the identity.
  - path: /run/tailscale-bootstrap.key
    content: "${tailscale_auth_key}"
    permissions: '0600'
    owner: root:root

  # Role parameters, sourced by common.sh. Not secret — safe on disk.
  - path: /etc/0x58-node.env
    permissions: '0644'
    owner: root:root
    content: |
      ${indent(6, node_env)}

  - path: /usr/local/sbin/node-common.sh
    permissions: '0755'
    owner: root:root
    content: |
      ${indent(6, common_script)}

  - path: /usr/local/sbin/node-bootstrap
    permissions: '0755'
    owner: root:root
    content: |
      ${indent(6, bootstrap_script)}

runcmd:
  - /usr/local/sbin/node-bootstrap
