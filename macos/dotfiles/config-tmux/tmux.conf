# ~/.config/tmux/tmux.conf — cross-platform (macOS + Linux), tmux 3.x
# Backed up in the 0x58 repo. Keep this file free of OS-specific hardcoded paths.

# ── Reload ─────────────────────────────────────────────────────────
# tmux 3.x loads ~/.config/tmux/tmux.conf — reload THAT file.
# Note the escaped "\;" so display-message is part of the binding,
# not a separate command run once at startup.
bind r source-file ~/.config/tmux/tmux.conf \; display 'Config reloaded'

# ── Terminal / general ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"   # fallback "screen-256color" if terminfo missing
# Truecolor for the OUTER terminal — enable only if yours supports it:
# set -as terminal-features ',*:RGB'
set -sg escape-time 10           # don't swallow <Esc> (matters for vim/nvim)
set -g focus-events on           # let nvim see pane focus in/out
set -g history-limit 300000
set -g base-index 1              # windows start at 1 (matches the number-row keys)
setw -g pane-base-index 1
set -g renumber-windows on       # closing a window renumbers the rest
set -g mouse on                  # forward wheel/click to apps; required for Claude Code fullscreen scroll

# Shell: macOS system bash is stuck at 3.2 — use Homebrew bash when present.
# On Linux tmux inherits the (already-modern) login shell, so no override needed.
if-shell '[ -x /opt/homebrew/bin/bash ]' 'set -g default-shell /opt/homebrew/bin/bash'

# ── Behaviour ──────────────────────────────────────────────────────
setw -g mode-keys vi
set -g allow-rename off
# Use the descriptive pane title (set via OSC by Claude Code, SSH, codex, etc.)
# as the window name, instead of the foreground binary name (which gives
# garbage like "2.1.168" for Claude Code and "codex-aarch64-a" for codex).
setw -g automatic-rename-format '#{pane_title}'
set -g visual-activity off
set -g visual-bell off
setw -g monitor-activity off
# Flag windows that ring the terminal bell (claude/codex ring it when a turn
# finishes / needs input). `any` (not `other`) so a bell in ANOTHER session's
# CURRENT window also alerts — bell-action is per-session, and `other` would
# skip that session's own current window, missing codex/claude on another Space.
# The window you're viewing clears its own flag instantly, so `any` adds no
# visible noise there. window-status-bell-style (below) draws the red marker;
# visual-bell off lets the BEL also pass through to kitty for a Dock bounce.
set -g bell-action any

# Desktop notification on every bell, via the alert-bell hook. Tool-agnostic:
# fires for claude, codex, or anything that rings the bell — even on another
# Space — as long as the session is attached. osascript banner crosses
# fullscreen Spaces (kitty's Dock bounce is hidden in fullscreen). Pass the
# belling window's session+index (safe tokens); the script looks up the name.
set-hook -g alert-bell {
  run-shell "~/.config/tmux/notify-bell.sh '#{session_name}' '#{window_index}'"
}

# ── Save scrollback to a file (prefix + P) ─────────────────────────
bind P command-prompt -p 'save history to filename:' -I '~/.tmux.history' \
  'capture-pane -S -300000 ; save-buffer %1 ; delete-buffer'

# ── Pane navigation ────────────────────────────────────────────────
# Alt+arrows, no prefix — quick jumps
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Vi-style with prefix — `prefix h/j/k/l` (these are NOT defaults;
# mode-keys vi only affects copy-mode, not pane navigation).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resize: prefix + Shift+hjkl, repeatable ───────────────────
# Uppercase so it doesn't clash with lowercase nav above. The -r flag
# keeps the key in the prefix table briefly, so after one prefix you can
# tap H H H to keep shrinking without re-pressing it. Steps of 5 cells.
# Avoids Ctrl+arrows, which macOS Mission Control grabs (spaces / exposé).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window navigation: Shift+arrows, no prefix ─────────────────────
# Browser-tab-style: Alt = within window (pane), Shift = across windows.
# Intercepts S-Left/Right from apps — none of Claude Code, codex, shells,
# vim, or less bind these, so it's safe in practice.
bind -n S-Left  previous-window
bind -n S-Right next-window

# ── Status bar ─────────────────────────────────────────────────────
setw -g clock-mode-colour colour143
setw -g mode-style 'fg=colour1 bg=colour8 bold'
setw -g pane-border-style 'fg=colour8 dim'
setw -g pane-active-border-style 'fg=colour3'
set -g status-position bottom
set -g status-justify right
set -g status-style 'fg=colour137 bg=colour8 dim'
set -g status-right ''
set -g status-left '#[fg=colour137,bg=colour8] %m:%d %H:%M '
set -g status-right-length 20
set -g status-left-length 50
setw -g window-status-current-style 'fg=colour1 bg=colour8 bold'
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '
setw -g window-status-style 'fg=colour9 bg=colour17'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'
set -g message-style 'fg=colour232 bg=colour8 bold'

# ── 1×2 starter layout (prefix + D) ────────────────────────────────
bind D split-window -h -p 50 -d

# ── Capture another pane's scrollback (exercise) ───────────────────
# Routed through run-shell so $(date ...) is expanded by /bin/sh and `>`
# redirects to a real file. -p prints to stdout; -J joins wrapped lines
# so codex output isn't chopped at the terminal width.
bind C run-shell "tmux capture-pane -p -J -S - -t {last-pane} > ~/tmp/tmux-buf-$(date +%Y%m%d-%H%M%S).txt"

# ── Plugins (tpm) ──────────────────────────────────────────────────
# First-time setup (config lives under ~/.config/tmux, so TPM installs
# plugins to ~/.config/tmux/plugins/ — keep tpm itself there too):
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# Then inside tmux press  prefix + I  to install.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# continuum builds ON resurrect — must be declared AFTER it (it wraps
# resurrect's save command) and BEFORE the tpm `run` line below.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'      # auto-restore the last save when the server starts
set -g @continuum-save-interval '15' # auto-save every 15 min (0 disables; default is 15)
run '~/.config/tmux/plugins/tpm/tpm'
