# ~/.config/tmux/tmux.conf — cross-platform (macOS + Linux), tmux 3.x
# Backed up in the 0x58 repo. Keep this file free of OS-specific hardcoded paths.

# ── Reload ─────────────────────────────────────────────────────────
# tmux 3.x loads ~/.config/tmux/tmux.conf — reload THAT file.
# Note the escaped "\;" so display-message is part of the binding,
# not a separate command run once at startup.
bind r source-file ~/.config/tmux/tmux.conf \; display 'Config reloaded'

# ── Terminal / general ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"   # fallback "screen-256color" if terminfo missing
# Truecolor for the OUTER terminal — enable only if yours supports it:
# set -as terminal-features ',*:RGB'
set -sg escape-time 10           # don't swallow <Esc> (matters for vim/nvim)
set -g focus-events on           # let nvim see pane focus in/out
set -g history-limit 300000
set -g base-index 1              # windows start at 1 (matches the number-row keys)
setw -g pane-base-index 1
set -g renumber-windows on       # closing a window renumbers the rest
# set -g mouse on                # uncomment to enable mouse select/resize/scroll

# Shell: macOS system bash is stuck at 3.2 — use Homebrew bash when present.
# On Linux tmux inherits the (already-modern) login shell, so no override needed.
if-shell '[ -x /opt/homebrew/bin/bash ]' 'set -g default-shell /opt/homebrew/bin/bash'

# ── Behaviour ──────────────────────────────────────────────────────
setw -g mode-keys vi
set -g allow-rename off
set -g visual-activity off
set -g visual-bell off
setw -g monitor-activity off
set -g bell-action none

# ── Save scrollback to a file (prefix + P) ─────────────────────────
bind P command-prompt -p 'save history to filename:' -I '~/.tmux.history' \
  'capture-pane -S -300000 ; save-buffer %1 ; delete-buffer'

# ── Pane navigation ────────────────────────────────────────────────
# Alt+arrows, no prefix — quick jumps
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Vi-style with prefix — `prefix h/j/k/l` (these are NOT defaults;
# mode-keys vi only affects copy-mode, not pane navigation).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Status bar ─────────────────────────────────────────────────────
setw -g clock-mode-colour colour143
setw -g mode-style 'fg=colour1 bg=colour8 bold'
setw -g pane-border-style 'fg=colour8 dim'
setw -g pane-active-border-style 'fg=colour3'
set -g status-position bottom
set -g status-justify right
set -g status-style 'fg=colour137 bg=colour8 dim'
set -g status-right ''
set -g status-left '#[fg=colour233,bg=colour8] %Y-%m-%d %a %T'
set -g status-right-length 20
set -g status-left-length 50
setw -g window-status-current-style 'fg=colour1 bg=colour8 bold'
setw -g window-status-current-format ' #I#[fg=colour249]:#[fg=colour255]#W#[fg=colour249]#F '
setw -g window-status-style 'fg=colour9 bg=colour17'
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'
set -g message-style 'fg=colour232 bg=colour8 bold'

# ── 1×2 starter layout (prefix + D) ────────────────────────────────
bind D split-window -h -p 50 -d

# ── Capture another pane's scrollback (exercise) ───────────────────
# Routed through run-shell so $(date ...) is expanded by /bin/sh and `>`
# redirects to a real file. -p prints to stdout; -J joins wrapped lines
# so codex output isn't chopped at the terminal width.
bind C run-shell "tmux capture-pane -p -J -S - -t {last-pane} > ~/tmp/tmux-buf-$(date +%Y%m%d-%H%M%S).txt"

# ── Plugins (tpm) ──────────────────────────────────────────────────
# First-time setup:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then inside tmux press  prefix + I  to install.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'
