# vim:fileencoding=utf-8:ft=conf:foldmethod=marker

font_family     Liberation Mono
font_size 14.0

# ── Bell / cross-Space alerts ──────────────────────────────────────
enable_audio_bell yes
visual_bell_duration 0.1
# Bounce the Dock icon when an UNFOCUSED window rings the bell. Claude Code
# rings the bell when a turn finishes / needs input, so a session on another
# Space pings you via the Dock. tmux also flags the window red (bell-action).
window_alert_on_bell yes

# ── Tabs / appearance ──────────────────────────────────────────────
hide_window_decorations yes
tab_bar_edge top
tab_bar_style powerline
# right-aligned date/time separator
tab_separator "{fmt.fg.tab}{fmt.bg.tab}"
tab_activity_symbol "🔔 "
wayland_titlebar_color #000000

# ── Keymaps ────────────────────────────────────────────────────────
map cmd+c        copy_to_clipboard
map cmd+v        paste_from_clipboard
map shift+insert paste_from_clipboard
enabled_layouts tall:bias=50;full_size=1;mirrored=false,stack
map kitty_mod+f5 load_config_file
map kitty_mod+[ layout_action decrease_num_full_size_windows
map kitty_mod+] layout_action increase_num_full_size_windows
map kitty_mod+/ layout_action mirror toggle
map kitty_mod+y layout_action mirror true
map kitty_mod+n layout_action mirror false
map kitty_mod+a toggle_layout tall
map kitty_mod+m toggle_maximized
map kitty_mod+z toggle_layout stack
map cmd+left previous_tab
map cmd+right next_tab

# ── Window / opacity ───────────────────────────────────────────────
start_as fullscreen
background_opacity 0.9
dynamic_background_opacity yes
allow_remote_control yes

# theme is included AFTER opacity so its colors win but opacity is preserved
shell /opt/homebrew/bin/bash
include ~/.config/kitty/kitty-themes/themes/Hybrid.conf
startup_session ~/.config/kitty/my-session.conf

# ── macOS ──────────────────────────────────────────────────────────
macos_traditional_fullscreen no
macos_window_resizable yes
macos_quit_when_last_window_closed yes
# Override kitty's native xterm-kitty so remote hosts without kitty terminfo
# behave — tradeoff: loses extended key reporting (e.g. Shift+Enter).
term xterm-256color

scrollback_pager nvim -u NONE -R -M -c 'lua require("kitty+page")(INPUT_LINE_NUMBER, CURSOR_LINE, CURSOR_COLUMN)' -
