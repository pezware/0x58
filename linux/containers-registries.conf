# Rootless podman registry configuration for the devbox.
# Restored to ~/.config/containers/registries.conf by macos/restore.sh.
#
# Added 2026-08-07 after an evening lost to its absence.
#
# Without an unqualified-search registry, podman cannot resolve a SHORT image
# name — and every compose file in go-monorepo uses them (redis:7.4-alpine,
# node:22-alpine, postgres:16-alpine). The failure surfaces as:
#
#     unable to retrieve auth token: invalid username/password: unauthorized
#
# which reads exactly like a credentials problem and is not one. The tell is
# that fully-qualified pulls (docker.io/library/redis:7.4-alpine) always
# worked, and that `docker pull` succeeded where `docker compose` did not.
#
# That error was misdiagnosed in an iden2 runbook as a permanent ghcr auth
# ceiling — "the podman service holds that login and a rebuild wipes it, do NOT
# try to log in yourself" — so the wrong diagnosis actively steered people away
# from the one-line fix. Two `task up` attempts were abandoned on that advice
# before anyone checked the registry search path.
#
# Tracking this file is what stops a rebuild from resurrecting that whole
# detour. It is also the reason bin/devbox-drift exists: this fix lived only on
# one disk for hours, and nothing would have noticed if the box had been
# rebuilt in that window.
unqualified-search-registries = ["docker.io"]
