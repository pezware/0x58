# Bound the systemd journal on the devbox.
#
# Installed to /etc/systemd/journald.conf.d/10-devbox.conf by restore.sh.
# A drop-in, not an edit of /etc/systemd/journald.conf: a distro upgrade
# rewrites that file and would take the cap with it.
#
# WHY THIS EXISTS
#
# On 2026-09-13 the root filesystem hit 91% (6.8G free of 79G) and the journal
# held 3.8G of it. journald.conf was empty, so the journal ran on its default
# cap of 10% of the filesystem -- 7.9G here. Nothing was wrong: it was filling
# the budget it was given, and that budget was set by disk size rather than by
# any judgement about how much history this box needs.
#
# Measured the same week: 429.8M of journal covered 2026-09-08T15:06 to
# 2026-09-14T19:50, which is 6.2 days, or ~69 MB/day. A kind control plane and
# four JVMs are most of that.
#
# A cap, not a cleanup timer. journald enforces this itself on every write, so
# the journal cannot spike between sweeps. A vacuum cron would let it grow to
# 7.9G and then claw it back, which is the same disk emergency on a delay.

[Journal]

# ~14 days of history at the measured 69 MB/day.
#
# The trade is retrospective diagnosis against disk. Two weeks covers "what
# changed since last Monday", which is the question the runbook keeps asking --
# a canary that ran 3 days ago, a stack that was healthy last week. 500M would
# cost ~7 days and save 500M on a disk with 27G free, which is the wrong side
# of that trade.
SystemMaxUse=1G

# An independent floor, and the one that matters in an emergency. SystemMaxUse
# is a fixed ceiling that knows nothing about the rest of the disk; if some
# other cache fills the volume, journald would keep writing up to its own 1G
# regardless. This makes it back off instead, leaving 2G for everything else.
SystemKeepFree=2G

# journald vacuums by deleting whole files, never parts of one. At the default
# (1/8 of SystemMaxUse) that is fine today, but the ratio is journald's to
# change; stating the number keeps the granularity ours. 128M gives ~8 files
# across the cap, so eviction drops ~1.7 days at a time rather than a week.
SystemMaxFileSize=128M
